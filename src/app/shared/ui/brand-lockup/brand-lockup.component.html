@if (variant === 'full') {
  <svg
    class="brand-lockup"
    viewBox="0 0 470 96"
    role="img"
    [attr.aria-label]="fullAriaLabel()"
  >
    <title>Eslam Afify Barakat</title>
    <rect x="2.8" y="2.8" width="90.4" height="90.4" rx="24" fill="none" class="frame" stroke-width="3.2" />
    <rect
      x="10"
      y="10"
      width="76"
      height="76"
      rx="18"
      fill="none"
      class="inner"
      stroke-width="1.7"
      stroke-dasharray="0.01 4.6"
      stroke-linecap="round"
    />
    <text
      x="48"
      y="64.5"
      text-anchor="middle"
      font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif"
      font-size="46"
      font-weight="800"
      letter-spacing="-1.6"
    >
      <tspan class="frame-fill">E</tspan><tspan class="inner-fill">B</tspan>
    </text>
    <text
      x="118"
      y="45"
      font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif"
      font-size="27"
      font-weight="700"
      letter-spacing="-.6"
      class="wordmark"
    >
      Eslam Afify Barakat
    </text>
    <text
      x="119"
      y="68"
      font-family="'IBM Plex Mono',ui-monospace,monospace"
      font-size="10.5"
      letter-spacing="2.4"
      class="subtitle"
    >
      {{ subtitle() }}
    </text>
  </svg>
} @else {
  <svg class="brand-lockup" viewBox="0 0 96 96" role="img" aria-label="Eslam Afify Barakat">
    <title>{{ monogramTitle() }}</title>
    <rect x="2.8" y="2.8" width="90.4" height="90.4" rx="24" fill="none" class="frame" stroke-width="3.2" />
    <rect
      x="10"
      y="10"
      width="76"
      height="76"
      rx="18"
      fill="none"
      class="inner"
      stroke-width="1.7"
      stroke-dasharray="0.01 4.6"
      stroke-linecap="round"
    />
    <text
      x="48"
      y="64.5"
      text-anchor="middle"
      font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif"
      font-size="46"
      font-weight="800"
      letter-spacing="-1.6"
    >
      <tspan class="frame-fill">E</tspan><tspan class="inner-fill">B</tspan>
    </text>
  </svg>
}
