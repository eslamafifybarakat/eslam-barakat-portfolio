<div class="filters" role="radiogroup" [attr.aria-label]="ariaLabel || null">
  @for (option of options; track option.key) {
    <button
      type="button"
      role="radio"
      class="fchip"
      [class.is-on]="option.key === active"
      [attr.aria-checked]="option.key === active"
      (click)="select(option.key)"
    >
      {{ option.label }}
    </button>
  }
</div>
