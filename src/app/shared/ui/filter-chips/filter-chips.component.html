<div class="filters" role="group">
  @for (option of options; track option.key) {
    <button
      type="button"
      class="fchip"
      [class.is-on]="option.key === active"
      [attr.aria-pressed]="option.key === active"
      (click)="select(option.key)"
    >
      {{ option.label }}
    </button>
  }
</div>
