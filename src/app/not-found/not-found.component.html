<section class="not-found">
  <div class="wrap">
    <p class="mono not-found__code">404</p>
    <h1 class="display">{{ data.titleKey | translate }}</h1>
    <p class="not-found__message">{{ data.messageKey | translate }}</p>
    <div class="not-found__cta">
      <app-button variant="primary" icon="arrow" [href]="homePath()">
        {{ data.ctaHomeKey | translate }}
      </app-button>
      <app-button variant="ghost" icon="grid" iconPosition="start" [href]="workPath()">
        {{ data.ctaWorkKey | translate }}
      </app-button>
    </div>
  </div>
</section>
