<section id="about">
  <div class="wrap sec">
    <app-section-head [eyebrow]="'portfolio_about_eyebrow' | translate" [heading]="'portfolio_about_title' | translate" />
    <div>
      <div class="prose">
        @for (p of aboutParagraphs(); track $index) {
          <div [innerHTML]="(p | localizedText) | safeHtml"></div>
        }
      </div>
      <div class="pillars">
        @for (pillar of pillars(); track pillar.icon) {
          <div class="pillar" appRevealOnScroll>
            <app-icon [name]="pillar.icon" />
            <div>
              <b>{{ pillar.title | localizedText }}</b>
              <span>{{ pillar.description | localizedText }}</span>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
