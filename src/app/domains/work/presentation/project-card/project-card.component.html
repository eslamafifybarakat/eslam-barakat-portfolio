<app-card [interactive]="true" [ariaLabel]="ariaLabel()" (activate)="openDetails.emit()">
  <span card-media>
    <app-project-poster [scene]="project.posterScene" [projectName]="project.name" [hostLabel]="hostLabel()" />
    @if (project.shot) {
      <img
        [src]="'/assets/shots/' + project.shot"
        [alt]="project.name"
        appLazyLoadImg
        appImgFallback
        width="440"
        height="275"
      />
    }
    <app-badge [flagship]="project.flagship">
      {{ project.flagship ? ('portfolio_work_filter_flagship' | translate) : kindLabel() }}
    </app-badge>
  </span>

  <span card-name>{{ project.name }}</span>
  <span card-when>{{ project.period | localizedText }}</span>
  <span card-desc>{{ project.description | localizedText }}</span>

  <span card-foot>
    <app-chip variant="tag">{{ kindLabel() }}</app-chip>
    <span class="card__acts">
      <button type="button" class="cbtn" (click)="openDetails.emit()">
        <app-icon name="grid" />
        {{ 'portfolio_work_details_cta' | translate }}
      </button>
      <a
        class="cbtn cbtn--go"
        [href]="liveHref()"
        target="_blank"
        rel="noopener"
        [attr.aria-label]="('portfolio_work_open_live' | translate) + ' — ' + project.name"
        (click)="$event.stopPropagation()"
      >
        <app-icon name="external" />
        {{ 'portfolio_work_open_live' | translate }}
      </a>
    </span>
  </span>
</app-card>
