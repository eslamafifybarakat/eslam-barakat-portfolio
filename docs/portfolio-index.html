/* ==========================================================================
   IDENTITY TOKENS
   Navy structure + steel neutrals from the EB mark, one cyan accent taken
   from the seam in the logo, one brass tone reserved for "flagship".
   ========================================================================== */
:root{
  --navy:#1F3864;
  --r-xs:8px; --r-sm:12px; --r:16px; --r-lg:20px; --r-xl:28px;
  --f-display:'Archivo','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --wrap:1240px; --head:66px;
  --ease:cubic-bezier(.2,.8,.24,1);
  --s1:6px; --s2:12px; --s3:20px; --s4:32px; --s5:48px; --s6:72px;
  --sec:clamp(80px,8.5vw,122px);
  --dx:4px;
}
html[dir="rtl"]{--dx:-4px}

html[data-theme="dark"]{
  --bg:#071018; --bg-2:#0A1621; --surface:#0F1E2C; --surface-2:#142836; --surface-3:#1C3345;
  --text:#E9F1F7; --muted:#97ABBC; --dim:#64798C;
  --line:rgba(151,171,188,.16); --line-2:rgba(151,171,188,.31);
  --accent:#67B4E3; --accent-2:#A9D7F3; --accent-soft:rgba(103,180,227,.13);
  --cta:#E0894A; --cta-ink:#2A1405; --cta-soft:rgba(224,137,74,.14);
  --accent-ink:#06131D;
  --brass:#E0894A; --brass-soft:rgba(224,137,74,.14);
  --metal:linear-gradient(115deg,#FFFFFF 0%,#D9E8F3 44%,#9EBACE 100%);
  --lift:0 26px 62px -34px rgba(2,8,14,.92);
  --dot:rgba(151,171,188,.10);
  --halo:rgba(103,180,227,.15); --halo-2:rgba(224,137,74,.10);
}
html[data-theme="light"]{
  --bg:#FCFBF9; --bg-2:#FFFFFF; --surface:#FFFFFF; --surface-2:#F7F6F3; --surface-3:#F1EFEB;
  --text:#0A2540; --muted:#54636F; --dim:#8E98A3;
  --line:rgba(10,37,64,.085); --line-2:rgba(10,37,64,.17);
  --accent:#0D4A78; --accent-2:#0A2540; --accent-soft:rgba(13,74,120,.08);
  --cta:#C1652B; --cta-ink:#FFFFFF; --cta-soft:rgba(193,101,43,.10);
  --accent-ink:#FFFFFF;
  --brass:#C1652B; --brass-soft:rgba(193,101,43,.10);
  --metal:linear-gradient(115deg,#0A2540 0%,#2B5C82 52%,#9CADBB 100%);
  --lift:0 20px 44px -30px rgba(10,37,64,.16);
  --dot:rgba(10,37,64,.04);
  --halo:rgba(13,74,120,.08); --halo-2:rgba(193,101,43,.07);
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[dir="rtl"] body{font-family:'IBM Plex Sans Arabic',var(--f-body)}
html[dir="rtl"] .display{font-family:'IBM Plex Sans Arabic',var(--f-display)}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
::selection{background:var(--accent);color:var(--accent-ink)}

/* ambient: two halos, a fine dot field, a whisper of grain */
body::before,body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0}
body::before{background:
  radial-gradient(44% 32% at 84% -6%,var(--halo),transparent 66%),
  radial-gradient(38% 28% at 2% 8%,var(--halo-2),transparent 68%)}
body::after{
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);
  background-size:24px 24px;
  mask-image:linear-gradient(to bottom,#000,transparent 55%);
  -webkit-mask-image:linear-gradient(to bottom,#000,transparent 55%)}
main,footer,.top,.sheet{position:relative;z-index:1}

.display{font-family:var(--f-display);font-weight:600;letter-spacing:-.022em;line-height:1.04}
.mono{font-family:var(--f-mono);font-size:.69rem;letter-spacing:.16em;text-transform:uppercase}
html[dir="rtl"] .mono,html[dir="rtl"] .tag,html[dir="rtl"] .count,html[dir="rtl"] .when,
html[dir="rtl"] .kv dt,html[dir="rtl"] .spec dt,html[dir="rtl"] .row__k,html[dir="rtl"] .skill__k,
html[dir="rtl"] .navlink,html[dir="rtl"] .hero__role,html[dir="rtl"] .gal__cap,html[dir="rtl"] .cap{
  letter-spacing:0;font-family:'IBM Plex Sans Arabic',var(--f-body);text-transform:none}
html[dir="rtl"] .navlink{font-size:.86rem}
html[dir="rtl"] .kv dt,html[dir="rtl"] .spec dt,html[dir="rtl"] .row__k,
html[dir="rtl"] .skill__k{font-size:.78rem}
.ltr,#dirLabel,.kv dd a,.row__v--ltr,.stat b,.gal__cap{direction:ltr;unicode-bidi:isolate;text-align:start}
.when,.count,.card__when{unicode-bidi:isolate}

#progress{position:fixed;inset-block-start:0;inset-inline-start:0;height:2px;width:0;z-index:95;
  background:linear-gradient(to var(--flow,right),var(--accent),var(--cta));transition:width .1s linear}

/* ==========================================================================
   HEADER
   ========================================================================== */
.top{position:fixed;inset-block-start:0;inset-inline:0;height:var(--head);z-index:80;
  display:flex;align-items:center;gap:var(--s3);padding-inline:clamp(16px,4vw,40px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px) saturate(1.4);
  border-block-end:1px solid var(--line)}
.lock{display:flex;align-items:center;gap:11px}
.lock img{height:34px;width:auto}
.lock__txt{display:flex;flex-direction:column;line-height:1.16}
.lock__txt b{font-family:var(--f-display);font-size:.96rem;font-weight:600;letter-spacing:-.018em}
.lock__txt i{font-size:.53rem;letter-spacing:.12em;color:var(--dim);font-style:normal;
  text-transform:uppercase;font-family:var(--f-mono)}
html[dir="rtl"] .lock__txt i{letter-spacing:.04em}
.nav{display:flex;gap:var(--s1);margin-inline-start:auto}
.navlink{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.15em;text-transform:uppercase;
  color:var(--dim);padding:9px 12px;border-radius:9px;transition:color .25s,background .25s}
.navlink:hover{color:var(--text);background:var(--surface-2)}
.navlink[aria-current="true"]{color:var(--accent);background:var(--accent-soft)}
.top__tools{display:flex;gap:7px;margin-inline-start:var(--s3)}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:11px;color:var(--muted);background:var(--surface);
  transition:color .25s,border-color .25s,transform .25s}
.iconbtn:hover{color:var(--text);border-color:var(--line-2);transform:translateY(-2px)}
.langbtn{font-family:var(--f-mono);font-size:.66rem;font-weight:600}
.i{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;flex:none}



/* ==========================================================================
   SHELL + EDITORIAL SECTION GRID
   ========================================================================== */
.wrap{width:min(var(--wrap),100% - 9vw);margin-inline:auto}
section{padding-block:var(--sec);position:relative}
section[id]{scroll-margin-block-start:calc(var(--head) + 12px)}
section + section::before{content:"";position:absolute;inset-block-start:0;inset-inline:0;height:1px;
  background:linear-gradient(to var(--flow,right),transparent,var(--line) 16%,var(--line) 84%,transparent)}
.sec{display:grid;grid-template-columns:minmax(230px,285px) minmax(0,1fr);gap:clamp(26px,4.5vw,70px);align-items:start}
.sec__head{position:sticky;inset-block-start:calc(var(--head) + 26px)}
.eyebrow{display:flex;align-items:center;gap:10px;color:var(--accent);margin-block-end:var(--s2)}
.eyebrow::before{content:"";width:20px;height:1px;background:currentColor;flex:none}
h2.sec-t{font-size:clamp(1.7rem,3.4vw,2.5rem);margin:0;font-family:var(--f-display);
  font-weight:700;letter-spacing:-.025em;line-height:1.08}
.sec-lede{color:var(--muted);font-size:.96rem;margin:var(--s3) 0 0}

/* ==========================================================================
   HERO
   ========================================================================== */
.hero{padding-block:calc(var(--head) + 66px) var(--sec);border:0}
.hero::before{display:none}
.hero__grid{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(0,.82fr);gap:clamp(30px,5vw,68px);align-items:center}
.hero h1{font-size:clamp(2.5rem,6.6vw,4.7rem);margin:var(--s3) 0 0}
.hero h1 .metal{background:var(--metal);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent}
.hero__role{font-family:var(--f-mono);font-size:clamp(.7rem,1.4vw,.84rem);letter-spacing:.26em;
  text-transform:uppercase;color:var(--accent);margin-block:var(--s3) 0}
.hero__lede{color:var(--muted);font-size:clamp(1rem,1.6vw,1.11rem);max-width:52ch;margin-block-start:var(--s3)}
.hero__cta{display:flex;flex-wrap:wrap;gap:10px;margin-block-start:var(--s4)}

/* identity panel: portrait + a mono spec sheet, replacing the old demo card */
.panel{border:1px solid var(--line);border-radius:var(--r-xl);background:var(--surface);
  padding:var(--s4);box-shadow:var(--lift)}
.panel__top{display:flex;gap:var(--s3);align-items:center;margin-block-end:var(--s4)}
.portrait{position:relative;width:96px;aspect-ratio:1;flex:none}
.portrait img{width:100%;height:100%;object-fit:cover;border-radius:22px;
  filter:grayscale(1) contrast(1.04);border:1px solid var(--line-2)}
.portrait::after{content:"";position:absolute;inset-block-end:-5px;inset-inline-end:-5px;
  width:16px;height:16px;border-radius:50%;background:var(--accent);
  border:3px solid var(--surface)}
.panel__who b{display:block;font-family:var(--f-display);font-size:1.06rem;font-weight:600}
.panel__who span{color:var(--dim);font-size:.86rem}
.spec{margin:0;display:grid;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden}
.spec > div{display:flex;gap:var(--s3);align-items:baseline;padding:11px 14px;background:var(--bg-2)}
.spec dt{font-family:var(--f-mono);font-size:.61rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim);width:74px;flex:none}
.spec dd{margin:0;font-size:.88rem;color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3);margin-block-start:var(--s4)}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;line-height:1;font-weight:600}
.stat span{font-family:var(--f-mono);font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);white-space:nowrap}
html[dir="rtl"] .stat span{letter-spacing:0;font-family:'IBM Plex Sans Arabic',var(--f-body);font-size:.7rem}

/* ==========================================================================
   BUTTONS
   ========================================================================== */
.btn{display:inline-flex;align-items:center;gap:9px;padding:13px 20px;border-radius:14px;
  font-weight:600;font-size:.93rem;border:1px solid transparent;min-height:46px;
  transition:transform .28s var(--ease),box-shadow .28s,background .25s,border-color .25s,color .25s}
.btn .i{width:17px;height:17px;transition:transform .3s var(--ease)}
.btn:hover .i{transform:translateX(var(--dx))}
.btn--primary{background:var(--cta);color:var(--cta-ink);
  box-shadow:0 14px 32px -16px var(--cta),inset 0 1px 0 rgba(255,255,255,.26)}
.btn--primary:hover{transform:translateY(-3px);box-shadow:0 20px 42px -16px var(--cta)}
.btn--ghost{border-color:var(--line-2);color:var(--text);background:var(--surface)}
.btn--ghost:hover{transform:translateY(-3px);border-color:var(--accent);color:var(--accent);
  background:var(--accent-soft)}
.btn--sm{padding:9px 14px;font-size:.83rem;min-height:38px;border-radius:11px}

/* ==========================================================================
   SUMMARY
   ========================================================================== */
.prose p{margin:0 0 var(--s3);color:var(--muted)}
.prose p:last-child{margin:0}
.prose strong{color:var(--text);font-weight:600}
.pillars{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-block-start:var(--s5)}
.pillar{border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;background:var(--surface);
  display:flex;gap:12px;align-items:flex-start;transition:border-color .3s,transform .3s var(--ease)}
.pillar:hover{border-color:var(--accent);transform:translateY(-3px)}
.pillar .i{color:var(--accent);margin-block-start:2px}
.pillar b{display:block;font-family:var(--f-display);font-size:.97rem;font-weight:600;margin-block-end:2px}
.pillar span{color:var(--muted);font-size:.87rem}

/* ==========================================================================
   SKILLS
   ========================================================================== */
.skills{display:grid;gap:var(--s4)}
.skill__k{display:flex;align-items:center;gap:9px;font-family:var(--f-mono);font-size:.66rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-block-end:var(--s2)}
.skill__k .i{width:15px;height:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.81rem;padding:6px 12px;border:1px solid var(--line);border-radius:10px;
  color:var(--muted);background:var(--surface);
  transition:color .22s,border-color .22s,transform .22s,background .22s}
.chip:hover{color:var(--text);border-color:var(--accent);background:var(--accent-soft);transform:translateY(-2px)}

/* ==========================================================================
   TIMELINE
   ========================================================================== */
.tl{position:relative;padding-inline-start:26px}
.tl::before{content:"";position:absolute;inset-block:12px 12px;inset-inline-start:4px;width:1px;
  background:linear-gradient(to bottom,var(--accent),var(--line) 46%,transparent)}
.job{position:relative;padding-block-end:var(--s6)}
.job:last-child{padding-block-end:0}
.job::before{content:"";position:absolute;inset-inline-start:-26px;inset-block-start:11px;
  width:9px;height:9px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 4px var(--accent-soft)}
.job__top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.job__co{font-family:var(--f-display);font-size:clamp(1.15rem,2.2vw,1.44rem);font-weight:600}
.when{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin-inline-start:auto}
.job__role{font-weight:600;margin-block:var(--s1) 2px}
.job__meta{color:var(--dim);font-size:.85rem;margin-block-end:var(--s3);display:flex;
  align-items:center;gap:10px;flex-wrap:wrap}
.job ul{margin:0;padding:0;list-style:none;display:grid;gap:11px}
.job li{color:var(--muted);position:relative;padding-inline-start:17px}
.job li::before{content:"";position:absolute;inset-inline-start:0;inset-block-start:.62em;
  width:5px;height:5px;border-radius:50%;background:var(--line-2)}
.job li strong{color:var(--text);font-weight:600}

/* ==========================================================================
   WORK
   ========================================================================== */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-block-end:var(--s3)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{padding:9px 15px;border:1px solid var(--line);border-radius:11px;font-size:.84rem;
  color:var(--muted);background:var(--surface);min-height:40px;
  transition:background .25s,border-color .25s,color .25s}
.fchip:hover{border-color:var(--line-2);color:var(--text)}
.fchip.is-on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.search{margin-inline-start:auto;position:relative;display:flex;align-items:center}
.search input{width:240px;max-width:44vw;padding:11px 14px;padding-inline-start:38px;border-radius:11px;
  border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:.87rem;
  min-height:42px;transition:border-color .25s,width .3s}
.search input:focus{border-color:var(--accent);outline:none;width:270px}
.search .i{position:absolute;inset-inline-start:12px;color:var(--dim);width:16px;height:16px;pointer-events:none}
.count{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.12em;color:var(--dim);
  text-transform:uppercase;margin:0 0 var(--s3)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:14px}
.card{position:relative;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);
  padding:13px;display:flex;flex-direction:column;gap:12px;text-align:start;cursor:pointer;
  transition:transform .35s var(--ease),border-color .3s,box-shadow .35s}
.card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:var(--lift)}
.card__shot{position:relative;aspect-ratio:16/10;border-radius:var(--r-sm);overflow:hidden;
  background:var(--surface-2);border:1px solid var(--line)}
.card__shot img,.card__shot svg{width:100%;height:100%;object-fit:cover;
  transition:transform .5s var(--ease)}
.card:hover .card__shot img,.card:hover .card__shot svg{transform:scale(1.035)}
.cap{position:absolute;inset-block-start:9px;inset-inline-start:9px;font-family:var(--f-mono);
  font-size:.55rem;letter-spacing:.11em;text-transform:uppercase;padding:4px 8px;border-radius:6px;
  background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(6px);color:var(--muted);
  border:1px solid var(--line)}
.cap--flag{color:var(--brass);border-color:var(--brass-soft)}
.card__body{display:flex;flex-direction:column;gap:7px;padding-inline:3px}
.card__head{display:flex;align-items:baseline;gap:9px}
.card__name{font-family:var(--f-display);font-size:1.02rem;font-weight:600;line-height:1.3}
.card__when{font-family:var(--f-mono);font-size:.58rem;letter-spacing:.09em;color:var(--dim);
  text-transform:uppercase;margin-inline-start:auto;white-space:nowrap;flex:none}
.card__desc{color:var(--muted);font-size:.885rem;margin:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card__foot{margin-block-start:auto;display:flex;align-items:center;gap:6px;
  padding:3px 3px 0;border-block-start:1px solid var(--line);padding-block-start:11px}
.tag{font-family:var(--f-mono);font-size:.56rem;letter-spacing:.09em;text-transform:uppercase;
  padding:4px 8px;border-radius:6px;background:var(--surface-2);color:var(--dim)}
.act{display:inline-flex;align-items:center;gap:6px;font-size:.79rem;font-weight:600;color:var(--accent);
  padding:6px 9px;border-radius:9px;transition:background .25s}
.act:hover{background:var(--accent-soft)}
.act .i{width:14px;height:14px}
.card__acts{margin-inline-start:auto;display:flex;gap:2px}

/* ==========================================================================
   MODAL + GALLERY
   ========================================================================== */
.modal{position:fixed;inset:0;z-index:110;display:none;align-items:center;justify-content:center;padding:18px}
.modal.is-open{display:flex}
.modal__veil{position:absolute;inset:0;background:rgba(3,6,12,.78);backdrop-filter:blur(8px);
  animation:fade .24s var(--ease)}
.modal__box{position:relative;width:min(800px,100%);max-height:88vh;overflow:auto;
  background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-xl);
  padding:clamp(16px,3vw,28px);animation:pop .4s var(--ease)}
.modal__x{position:absolute;inset-block-start:14px;inset-inline-end:14px;z-index:2}
.gal__main{aspect-ratio:16/10;border-radius:var(--r);border:1px solid var(--line);
  overflow:hidden;background:var(--surface-2)}
.gal__main img,.gal__main svg{width:100%;height:100%;object-fit:cover}
.gal__thumbs{display:flex;gap:7px;margin-block-start:7px;flex-wrap:wrap}
.gal__t{width:70px;aspect-ratio:16/10;border-radius:8px;overflow:hidden;border:1px solid var(--line);
  background:var(--surface-2);opacity:.55;transition:opacity .25s,border-color .25s}
.gal__t.is-on,.gal__t:hover{opacity:1;border-color:var(--accent)}
.gal__t img{width:100%;height:100%;object-fit:cover}
.gal__cap{font-family:var(--f-mono);font-size:.58rem;letter-spacing:.11em;color:var(--dim);
  text-transform:uppercase;margin:9px 0 var(--s4)}
.modal h3{font-family:var(--f-display);font-size:clamp(1.3rem,3vw,1.85rem);font-weight:600;
  margin:0 40px var(--s1) 0;letter-spacing:-.02em}
html[dir="rtl"] .modal h3{margin:0 0 var(--s1) 40px}
.modal__when{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.1em;color:var(--accent);
  text-transform:uppercase;margin:0 0 var(--s3)}
.modal__desc{color:var(--muted);margin:0 0 var(--s3)}
.kv{border-block-start:1px solid var(--line);padding-block:var(--s3);display:grid;
  grid-template-columns:96px 1fr;gap:14px;margin:0}
.kv dt{font-family:var(--f-mono);font-size:.61rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.kv dd{margin:0;font-size:.88rem;color:var(--muted);word-break:break-word}
.kv dd a{color:var(--accent);display:inline-flex;align-items:center;gap:6px}
.kv dd a:hover{text-decoration:underline}
.linklist{display:grid;gap:7px}
.note{color:var(--dim);font-size:.81rem;font-style:italic;margin:var(--s2) 0 0}
.modal__cta{display:flex;gap:9px;flex-wrap:wrap;margin-block-start:var(--s4)}

/* ==========================================================================
   EDUCATION + CONTACT
   ========================================================================== */
.edu{display:grid;gap:10px}
.edu__row{border:1px solid var(--line);border-radius:var(--r);padding:17px 19px;background:var(--surface);
  display:flex;flex-wrap:wrap;gap:5px 15px;align-items:baseline;transition:border-color .3s}
.edu__row:hover{border-color:var(--accent)}
.edu__row .i{color:var(--accent);align-self:center}
.edu__row b{font-family:var(--f-display);font-size:1rem;font-weight:600}
.edu__row span{color:var(--muted);font-size:.9rem}
.edu__row em{font-family:var(--f-mono);font-size:.63rem;letter-spacing:.09em;color:var(--accent);
  font-style:normal;text-transform:uppercase;margin-inline-start:auto}

.contact{border:1px solid var(--line);border-radius:var(--r-xl);padding:clamp(24px,4.5vw,54px);
  background:var(--surface);position:relative;overflow:hidden}
.contact::before{content:"";position:absolute;inset-block-start:-45%;inset-inline-end:-8%;
  width:56%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--halo),transparent 66%)}
.contact > *{position:relative}
.contact h2{font-family:var(--f-display);font-size:clamp(1.7rem,3.6vw,2.6rem);font-weight:700;
  letter-spacing:-.025em;margin:0 0 var(--s3);max-width:24ch}
.rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:10px;margin-block-start:var(--s4)}
.row{display:flex;align-items:center;gap:12px;padding:15px 16px;background:var(--bg-2);
  border:1px solid var(--line);border-radius:var(--r);min-height:60px;
  transition:border-color .25s,transform .25s var(--ease)}
.row:hover{border-color:var(--accent);transform:translateY(-2px)}
.row .i{color:var(--accent)}
.row__k{font-family:var(--f-mono);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);display:block;margin-block-end:2px}
.row__v{color:var(--text);font-size:.9rem;word-break:break-word}
.row__go{margin-inline-start:auto;color:var(--dim);flex:none}

footer{border-block-start:1px solid var(--line);padding-block:var(--s5)}
footer .wrap{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
footer .brand{height:40px;width:auto}
footer .mono{color:var(--dim)}

#toast{position:fixed;inset-block-end:22px;inset-inline-start:50%;transform:translate(-50%,90px);
  background:var(--text);color:var(--bg);padding:12px 20px;border-radius:12px;font-size:.86rem;
  font-weight:600;z-index:130;opacity:0;transition:transform .4s var(--ease),opacity .4s;pointer-events:none}
#toast.is-up{transform:translate(-50%,0);opacity:1}
#top{position:fixed;inset-block-end:18px;inset-inline-end:18px;z-index:70;opacity:0;
  transform:translateY(14px);pointer-events:none;transition:opacity .3s,transform .3s}
#top.is-up{opacity:1;transform:none;pointer-events:auto}

.rv{opacity:0;transform:translateY(18px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
@keyframes wipe{0%{clip-path:inset(0 0 0 0)}46%{clip-path:inset(0 0 0 100%);opacity:.3}
  54%{clip-path:inset(0 100% 0 0);opacity:.3}100%{clip-path:inset(0 0 0 0)}}
.flipping main{animation:wipe .58s var(--ease)}

/* ==========================================================================
   RESPONSIVE
   ========================================================================== */
@media (max-width:1080px){
  .nav{display:none}
  .lock__txt{display:none}
  .top__tools{margin-inline-start:auto}
  .sec{grid-template-columns:minmax(0,1fr);gap:var(--s4)}
  .sec__head{position:static}
  .hero__grid{grid-template-columns:minmax(0,1fr);gap:var(--s5)}
  .hero{padding-block:calc(var(--head) + 34px) var(--sec)}
}
@media (max-width:680px){
  body{font-size:15.5px}
  :root{--sec:54px;--s5:36px;--s6:44px}
  .wrap{width:min(var(--wrap),100% - 8vw)}
  .hero h1{font-size:clamp(2.2rem,10.5vw,3rem)}
  .hero__cta .btn{flex:1 1 46%;justify-content:center}
  .panel{padding:var(--s3);border-radius:var(--r-lg)}
  .panel__top{gap:var(--s2)}
  .portrait{width:76px}
  .spec dt{width:64px}
  .pillars{grid-template-columns:minmax(0,1fr)}
  .stat span{white-space:normal}
  .filters{overflow-x:auto;flex-wrap:nowrap;margin-inline:-4vw;padding-inline:4vw;
    scroll-snap-type:x mandatory;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .fchip{flex:none;scroll-snap-align:start}
  .search{margin-inline-start:0;width:100%}
  .search input,.search input:focus{width:100%;max-width:none}
  .grid{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:1fr;gap:4px;padding-block:var(--s2)}
  .when,.edu__row em{margin-inline-start:0;width:100%}
  .modal{padding:0;align-items:flex-end}
  .modal__box{width:100%;max-height:93vh;border-radius:var(--r-xl) var(--r-xl) 0 0}
  .rows{grid-template-columns:1fr}
  footer .wrap{flex-direction:column;align-items:flex-start;gap:var(--s3)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}
  html{scroll-behavior:auto}.rv{opacity:1;transform:none}
}
@media print{
  .top,.sheet,#top,#progress,.hero__cta,.toolbar,.card__acts,.modal{display:none}
  body::before,body::after{display:none}
  body{background:#fff;color:#000}
  .sec{grid-template-columns:1fr}
}


/* ==========================================================================
   ENHANCEMENTS — duotone portrait, richer contact block, layered art frames
   ========================================================================== */

/* portrait picks up the two brand hues instead of flat grey */
.portrait{border-radius:22px;overflow:visible}
.portrait img{width:100%;height:100%;object-fit:cover;
  filter:grayscale(1) contrast(1.1) brightness(1.04)}
.portrait__wrap{display:block;position:relative;width:100%;height:100%;border-radius:22px;
  overflow:hidden;border:1px solid var(--line-2)}
.portrait__wrap::after{content:"";position:absolute;inset:0;
  background:linear-gradient(148deg,var(--accent),var(--cta));
  mix-blend-mode:color;opacity:.5}
.portrait__wrap::before{content:"";position:absolute;inset:0;z-index:2;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.portrait img{border-radius:0;border:0}

/* project art gets a frame, a wash and a soft glow */
.card__shot{background:
  radial-gradient(78% 62% at 12% 4%,var(--accent-soft),transparent 62%),
  radial-gradient(64% 54% at 96% 96%,var(--cta-soft),transparent 60%),
  var(--surface-2)}
.card__shot::after{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);border-radius:inherit}
.gal__main{background:
  radial-gradient(70% 60% at 10% 2%,var(--accent-soft),transparent 60%),
  radial-gradient(60% 50% at 96% 98%,var(--cta-soft),transparent 58%),
  var(--surface-2)}

/* ---------------- project card ground: hairline weave + mark watermark ------ */
html[data-theme="dark"]{--weave:rgba(151,171,188,.055);--wmark:rgba(103,180,227,.06)}
html[data-theme="light"]{--weave:rgba(10,37,64,.03);--wmark:rgba(13,74,120,.05)}
.card{background-image:
  repeating-linear-gradient(135deg,var(--weave) 0 1px,transparent 1px 16px),
  radial-gradient(120% 90% at 100% 0%,var(--accent-soft),transparent 46%);
  background-repeat:no-repeat;background-size:100% 100%}
.card::before{content:"";position:absolute;inset-block-end:-14px;inset-inline-end:-12px;
  width:132px;height:132px;pointer-events:none;opacity:.9;
  background:var(--wmark);
  -webkit-mask:var(--wm) center/contain no-repeat;mask:var(--wm) center/contain no-repeat}
.card__shot,.card__body,.card__foot{position:relative;z-index:1}

/* ---------------- project card actions: real buttons ---------------- */
.cbtn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;
  padding:0 13px;border-radius:11px;font-size:.81rem;font-weight:600;
  border:1px solid var(--line);background:var(--surface-2);color:var(--text);
  transition:background .25s,border-color .25s,color .25s,transform .25s var(--ease),box-shadow .25s}
.cbtn .i{width:15px;height:15px}
.cbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);
  transform:translateY(-1px)}
.cbtn--go{border-color:transparent;background:var(--cta-soft);color:var(--cta)}
.card:hover .cbtn--go{background:var(--cta);color:var(--cta-ink);
  box-shadow:0 10px 22px -12px var(--cta)}
.cbtn--go:hover{background:var(--cta);border-color:var(--cta);color:var(--cta-ink);
  transform:translateY(-1px)}
.card__acts{margin-inline-start:auto;display:flex;gap:7px}
@media (max-width:680px){
  .card__foot{flex-wrap:wrap;gap:8px}
  .card__acts{width:100%;margin-inline-start:0}
  .cbtn{flex:1}
}

/* ---------------- contact ---------------- */
.contact{padding:0;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(150deg,var(--surface),var(--bg-2))}
.contact::before{display:none}
.contact__grid{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr)}
.contact__say{padding:clamp(24px,4vw,48px);position:relative;
  border-inline-end:1px solid var(--line)}
.contact__say::before{content:"";position:absolute;inset-block-start:-30%;inset-inline-start:-20%;
  width:70%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,var(--halo),transparent 66%);pointer-events:none}
.contact__say > *{position:relative}
.contact h2{margin:0 0 var(--s3);max-width:22ch}
.avail{display:grid;gap:9px;margin-block:var(--s4) var(--s4)}
.avchip{display:flex;align-items:center;gap:9px;font-size:.86rem;color:var(--muted)}
.avchip i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--cta);
  box-shadow:0 0 0 4px var(--cta-soft)}
.avchip:first-child i{background:#4ADE80;box-shadow:0 0 0 4px rgba(74,222,128,.16)}
.contact__cta{display:flex;gap:9px;flex-wrap:wrap}
.rows{display:grid;gap:0;background:none;border:0;border-radius:0;margin:0;
  grid-template-columns:minmax(0,1fr)}
.row{border:0;border-block-end:1px solid var(--line);border-radius:0;background:none;
  padding:16px clamp(20px,3vw,32px);gap:14px;min-height:66px}
.row:last-child{border-block-end:0}
.row:hover{background:var(--surface-2);transform:none}
.row__ic{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
  border:1px solid var(--line);background:var(--surface-2);color:var(--accent);
  transition:border-color .25s,color .25s,background .25s}
.row:hover .row__ic{border-color:var(--cta);color:var(--cta);background:var(--cta-soft)}
.row__txt{display:flex;flex-direction:column;min-width:0}
.row__go{color:var(--dim)}
.row:hover .row__go{color:var(--cta)}

@media (max-width:900px){
  .contact__grid{grid-template-columns:minmax(0,1fr)}
  .contact__say{border-inline-end:0;border-block-end:1px solid var(--line)}
}


/* ==========================================================================
   AMBIENT VECTOR ART — a drawn backdrop, stronger in light mode where a flat
   surface reads cheap, restrained in dark where the halos already carry it.
   ========================================================================== */
html[data-theme="dark"]{--art:.46;--art-line:rgba(151,171,188,.30);--art-grid:rgba(151,171,188,.10)}
html[data-theme="light"]{--art:.8;--art-line:rgba(13,74,120,.14);--art-grid:rgba(10,37,64,.042)}
.bgart{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;
  opacity:var(--art);transition:opacity .4s}
html[data-theme="light"] body::before{background:
  radial-gradient(52% 40% at 88% -8%,var(--halo),transparent 64%),
  radial-gradient(46% 34% at -4% 6%,var(--halo-2),transparent 66%),
  linear-gradient(180deg,rgba(255,255,255,.95),transparent 30%)}

/* ==========================================================================
   SIDE MENU — a real panel: header, icon-led rows, contact actions, controls
   ========================================================================== */
.sheet{position:fixed;inset:0;z-index:120;display:none;padding:0}
.sheet.is-open{display:block}
.sheet__veil{position:absolute;inset:0;background:rgba(6,4,16,.62);
  backdrop-filter:blur(10px);animation:fade .3s var(--ease)}
.sheetp{position:absolute;inset-block:0;inset-inline-end:0;width:min(390px,88vw);
  display:flex;flex-direction:column;background:var(--bg-2);
  border-inline-start:1px solid var(--line-2);
  box-shadow:-30px 0 70px -30px rgba(0,0,0,.6);
  transition:transform .42s var(--ease)}
html[dir="ltr"] .sheetp{transform:translateX(100%)}
html[dir="rtl"] .sheetp{transform:translateX(-100%);box-shadow:30px 0 70px -30px rgba(0,0,0,.6)}
.sheet.is-open .sheetp{transform:none}
.sheetp__top{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 18px;border-block-end:1px solid var(--line)}
.sheetp__top img{height:34px;width:auto}
.sheetnav{display:grid;gap:4px;padding:16px 14px;overflow:auto;flex:1;align-content:start}
.sheetnav a{display:flex;align-items:center;gap:13px;padding:13px 12px;border-radius:14px;
  font-family:var(--f-display);font-size:1.02rem;font-weight:600;
  border:1px solid transparent;transition:background .25s,border-color .25s,transform .25s}
.sheetnav a:hover,.sheetnav a[aria-current="true"]{background:var(--surface);border-color:var(--line)}
.sheetnav a[aria-current="true"]{color:var(--accent)}
.sheetnav .tile{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
  border:1px solid var(--line);background:var(--surface-2);color:var(--accent)}
.sheetnav a[aria-current="true"] .tile{border-color:var(--accent);background:var(--accent-soft)}
.sheetnav .go{margin-inline-start:auto;color:var(--dim);display:flex}
.sheetnav .go .i{width:16px;height:16px}
.sheet.is-open .sheetnav a{animation:slidein .5s var(--ease) backwards}
.sheetnav a:nth-child(1){animation-delay:.06s}.sheetnav a:nth-child(2){animation-delay:.1s}
.sheetnav a:nth-child(3){animation-delay:.14s}.sheetnav a:nth-child(4){animation-delay:.18s}
.sheetnav a:nth-child(5){animation-delay:.22s}.sheetnav a:nth-child(6){animation-delay:.26s}
.sheetnav a:nth-child(7){animation-delay:.3s}
@keyframes slidein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sheetp__foot{padding:16px 18px 22px;border-block-start:1px solid var(--line);
  display:grid;gap:14px;background:var(--surface-2)}
.sheetp__cta{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheetp__cta .btn{justify-content:center;padding-inline:12px}
.sheetp__row{display:flex;align-items:center;gap:8px}
.sheetp__row .mono{margin-inline-start:auto;color:var(--dim);font-size:.55rem;
  max-width:62%;text-align:end;line-height:1.5}
html[dir="rtl"] .i--dir{transform:scaleX(-1)}
html[dir="rtl"] .btn:hover .i--dir{transform:scaleX(-1) translateX(4px)}

 en:[`<p><strong>Senior Angular Frontend Developer</strong> with 5+ years of professional experience since June 2021, building and maintaining large-scale production web applications. I specialise in modern Angular architecture — <strong>Standalone Components, Signals, SSR / Angular Universal, RxJS</strong> and TypeScript — applied through <strong>Domain-Driven Design</strong> with facade, repository and store layers.</p>`,

    <g transform="translate(0,30)">${scene}</g>
    <text x="26" y="254" direction="ltr" text-anchor="start" font-family="IBM Plex Mono, monospace" font-size="11"
      letter-spacing="1.6" fill="var(--dim)">${esc(host(p.l[0]).toUpperCase())}</text>
  </svg>`;
}



/* ==========================================================================
   STATE
   ========================================================================== */
let LANG="en", FILTER="all", QUERY="", GAL=0, GALITEMS=[];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const t=()=>T[LANG];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const host=u=>{try{return new URL(u).host.replace(/^www\./,"")}catch{return u}};

function renderChrome(){
  const L=t();
  const html=document.documentElement;
  html.lang=LANG; html.dir=L.dir;
  html.style.setProperty("--flow", L.dir==="rtl"?"left":"right");
  html.style.setProperty("--flowo", L.dir==="rtl"?"right":"left");
  $$("[data-t]").forEach(el=>{const v=L[el.dataset.t]; if(typeof v==="string") el.textContent=v;});
  $$(".langbtn").forEach(b=>{b.textContent=L.other; b.setAttribute("aria-label","Switch to "+L.otherLabel);});
  $("#q").placeholder=L.searchPh;
  const items=Object.entries(L.nav);
  $("#nav").innerHTML=items.map(([id,label])=>
    `<a class="navlink" href="#${id}" data-spy="${id}">${esc(label)}</a>`).join("");
  $("#sheetNav").innerHTML=items.map(([id,label])=>
    `<a href="#${id}" data-spy="${id}"><span class="tile">${ic(NAV_IC[id]||"arrow")}</span>
       ${esc(label)}<span class="go">${ic("arrow","i i--dir")}</span></a>`).join("");
  $$("#sheetNav a").forEach(a=>a.addEventListener("click",e=>{
    e.preventDefault();
    const el=document.querySelector(a.getAttribute("href"));
    sheet(false);                       // restore scrolling first
    if(el) setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"start"}),60);
  }));
  $("#spec").innerHTML=[["sRole","vRole"],["sBase","vBase"],["sSince","vSince"],
    ["sFocus","vFocus"],["sLangs","vLangs"]].map(([k,v])=>
    `<div><dt>${esc(L[k])}</dt><dd>${esc(L[v])}</dd></div>`).join("");
}

function renderBody(){
  const L=t();
  $("#aboutText").innerHTML=ABOUT[LANG].join("");
  const PICONS=["layers","wave","mirror","seo"];
  $("#pillars").innerHTML=PILLARS.map((p,i)=>{
    const [ttl,sub]=p[LANG];
    return `<div class="pillar rv">${ic(PICONS[i]||"layers")}<div><b>${esc(ttl)}</b><span>${esc(sub)}</span></div></div>`;
  }).join("");

  const SICONS=["code","layers","route","wave","mirror","gauge","shield"];
  $("#skills").innerHTML=SKILLS.map((s,i)=>
    `<div class="skill rv"><div class="skill__k">${ic(SICONS[i]||"code")}${esc(s.k[LANG])}</div>
     <div class="chips">${s.v.split(" · ").map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div></div>`).join("");

  $("#jobs").innerHTML=JOBS.map(j=>`
    <article class="job rv">
      <div class="job__top"><span class="job__co">${esc(j.co)}</span>
        <span class="job__when">${esc(j.when[LANG])}</span></div>
      <p class="job__role">${esc(j.role[LANG])}</p>
      <p class="job__meta"><span>${esc(j.meta[LANG])}</span>${j.site?
        `<a class="act" href="${j.site}" target="_blank" rel="noopener">${ic("external")}<span class="ltr">${esc(host(j.site))}</span></a>`:""}</p>
      <ul>${j.bullets[LANG].map(b=>`<li>${b}</li>`).join("")}</ul>
    </article>`).join("");

  $("#filters").innerHTML=[["all","fAll"],["ng","fAngular"],["js","fJs"],["feat","fFeat"]]
    .map(([k,key])=>`<button class="fchip${FILTER===k?" is-on":""}" data-f="${k}">${esc(L[key])}</button>`).join("");

  const EICONS=["cap","doc","globe"];
  $("#edu").innerHTML=EDU.map((e,i)=>
    `<div class="edu__row rv">${ic(EICONS[i]||"cap")}<b>${esc(e.t[LANG])}</b>
     <span>${esc(e.p[LANG])}</span><em>${esc(e.w[LANG])}</em></div>`).join("");

  $("#avail").innerHTML=["av1","av2","av3"].map(k=>
    `<span class="avchip"><i></i>${esc(L[k])}</span>`).join("");
  $("#rows").innerHTML=CONTACT.map(c=>
    `<a class="row" href="${c.href}"${c.href.startsWith("http")?' target="_blank" rel="noopener"':""}${c.copy?` data-copy="${c.v}"`:""}>
       <span class="row__ic">${ic(c.i)}</span>
       <span class="row__txt"><span class="row__k">${esc(L[c.k])}</span>
         <span class="row__v${c.ltr?" row__v--ltr":""}">${esc(c.v)}</span></span>
       <span class="row__go">${ic(c.copy?"copy":"arrow")}</span></a>`).join("");

  renderGrid(); observe();
}

function visible(){
  const q=QUERY.trim().toLowerCase();
  return WORK.filter(p=>{
    if(FILTER==="feat" && !p.f) return false;
    if((FILTER==="ng"||FILTER==="js") && p.k!==FILTER) return false;
    if(!q) return true;
    return (p.n+" "+p.s+" "+p.d[LANG]+" "+p.l.join(" ")).toLowerCase().includes(q);
  });
}

function renderGrid(){
  const L=t(), list=visible();
  $("#count").textContent=L.countTpl(list.length, WORK.length);
  if(!list.length){ $("#grid").innerHTML=`<p style="color:var(--muted)">${esc(L.none)}</p>`; return; }
  $("#grid").innerHTML=list.map(p=>{
    const i=WORK.indexOf(p);
    const art=p.shot
      ? `<img src="${p.shot}" alt="${esc(p.n)}" loading="lazy" onerror="swapPoster(this,${i})">`
      : poster(p);
    return `<article class="card rv" data-open="${i}" tabindex="0" role="button"
              aria-label="${esc(p.n)} — ${esc(L.more)}">
      <span class="card__shot">${art}
        <span class="cap${p.f?" cap--flag":""}">${p.f?esc(L.fFeat):(p.k==="ng"?"Angular":"JavaScript")}</span>
      </span>
      <span class="card__body">
        <span class="card__head"><span class="card__name">${esc(p.n)}</span>
          <span class="card__when">${esc(p.w[LANG])}</span></span>
        <p class="card__desc">${esc(p.d[LANG])}</p>
      </span>
      <span class="card__foot">
        <span class="tag">${p.k==="ng"?"Angular":"JavaScript"}</span>
        <span class="card__acts">
          <button class="cbtn" data-open="${i}">${ic("grid")}${esc(L.more)}</button>
          <a class="cbtn cbtn--go" href="${p.l[0]}" target="_blank" rel="noopener"
             aria-label="${esc(L.openLive)} — ${esc(p.n)}">${ic("external")}${esc(L.openLive)}</a>
        </span></span>
    </article>`;
  }).join("");
  observe();
}
function swapPoster(img,i){
  const s=document.createElement("span");
  s.innerHTML=poster(WORK[i]);
  img.replaceWith(s.firstElementChild);
}

/* ---------- modal + gallery ---------- */
/* Only show a screenshot slot once the file actually loads, so a missing
   asset never leaves an empty thumbnail or a mislabelled caption. */
function probe(list, done){
  const ok=[]; let left=list.length;
  if(!left) return done(ok);
  list.forEach((src,n)=>{
    const im=new Image();
    im.onload =()=>{ ok[n]=src; if(--left===0) done(ok.filter(Boolean)); };
    im.onerror=()=>{ if(--left===0) done(ok.filter(Boolean)); };
    im.src=src;
  });
}
let lastFocus=null;
function openModal(i){
  const p=WORK[i], L=t();
  lastFocus=document.activeElement;
  GALITEMS=[]; GAL=0;   // start from the vector, add screenshots only once they load
  $("#mTitle").textContent=p.n;
  $("#mWhen").textContent=p.w[LANG];
  $("#mDesc").textContent=p.d[LANG];
  $("#mStack").textContent=p.s.replace(/ · /g,", ");
  $("#mLinks").innerHTML=p.l.map(u=>
    `<a href="${u}" target="_blank" rel="noopener">${ic("external")}<span class="ltr">${esc(u)}</span></a>`).join("");
  $("#mNote").textContent=p.note ? L.noteLbl+": "+p.note[LANG] : "";
  $("#mOpen").href=p.l[0];
  $("#mOpenTxt").textContent=L.openLive;
  drawGallery(i);
  probe(p.shots && p.shots.length ? p.shots : (p.shot ? [p.shot] : []), ok=>{
    if(!ok.length) return;
    GALITEMS=ok; GAL=0; drawGallery(i);
  });
  $("#modal").classList.add("is-open");
  document.body.style.overflow="hidden";
  $("#modal .modal__x").focus();
}
function drawGallery(i){
  const p=WORK[i], L=t();
  const main=$("#galMain"), thumbs=$("#galThumbs");
  if(!GALITEMS.length){
    main.innerHTML=poster(p);
    thumbs.innerHTML="";
    return;
  }
  main.innerHTML=`<img src="${GALITEMS[GAL]}" alt="${esc(p.n)}" onerror="swapPoster(this,${i})">`;
  thumbs.innerHTML=GALITEMS.length>1 ? GALITEMS.map((s,n)=>
    `<button class="gal__t${n===GAL?" is-on":""}" data-gal="${n}" data-i="${i}">
       <img src="${s}" alt="" onerror="this.remove()"></button>`).join("") : "";
}
function closeModal(){
  $("#modal").classList.remove("is-open");
  document.body.style.overflow="";
  if(lastFocus) lastFocus.focus();
}

/* ---------- reveal / counters / scroll ---------- */
let io;
function observe(){
  if(!("IntersectionObserver" in window)){ $$(".rv").forEach(e=>e.classList.add("in")); return; }
  io = io || new IntersectionObserver(es=>es.forEach((e,n)=>{
    if(e.isIntersecting){ setTimeout(()=>e.target.classList.add("in"), Math.min(n,6)*50); io.unobserve(e.target); }
  }),{rootMargin:"0px 0px -8% 0px"});
  $$(".rv:not(.in)").forEach(e=>io.observe(e));
}
function counters(){
  $$("[data-count]").forEach(el=>{
    const to=+el.dataset.count, sfx=el.dataset.suffix||""; let n=0;
    (function step(){ n+=Math.max(1,Math.round(to/26));
      if(n>=to){ el.textContent=to+sfx; return; }
      el.textContent=n; requestAnimationFrame(step); })();
  });
}
const SECTIONS=["home","about","stack","path","work","learning","contact"];
function onScroll(){
  const h=document.documentElement;
  $("#progress").style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+"%";
  $("#top").classList.toggle("is-up",h.scrollTop>600);
  let cur=SECTIONS[0];
  for(const id of SECTIONS){
    const el=document.getElementById(id);
    if(el && el.getBoundingClientRect().top<=window.innerHeight*0.35) cur=id;
  }
  $$(".navlink,.sheetnav a").forEach(a=>a.setAttribute("aria-current",String(a.dataset.spy===cur)));
}
let toastTimer;
function toast(m){
  const el=$("#toast"); el.textContent=m; el.classList.add("is-up");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("is-up"),2200);
}
function setLang(next){
  LANG=next;
  document.body.classList.add("flipping");
  setTimeout(()=>document.body.classList.remove("flipping"),620);
  renderChrome(); renderBody(); onScroll();
}
function setTheme(next){
  document.documentElement.dataset.theme=next;
  $$(".themeIcon").forEach(s=>s.outerHTML=ic(next==="dark"?"sun":"moon","i themeIcon"));
  $$(".brand").forEach(img=>img.src = next==="dark" ? LOGO_WHITE : LOGO_COLOR);
  $$(".markimg").forEach(img=>img.src = next==="dark" ? MARK_WHITE : MARK_COLOR);
}
function sheet(open){
  const s=$("#sheet");
  s.classList.toggle("is-open",open);
  s.setAttribute("aria-hidden",String(!open));
  $("#burger").setAttribute("aria-expanded",String(open));
  document.body.style.overflow=open?"hidden":"";
  if(open) s.querySelector("[data-sheetclose]").focus();
}
/* "See the work" — jump to the section, land on the grid, and make the
   keyboard focus land there too rather than staying in the hero. */
function goWork(e){
  e.preventDefault();
  document.getElementById("work").scrollIntoView({behavior:"smooth",block:"start"});
  setTimeout(()=>{ const f=$(".fchip"); if(f) f.focus({preventScroll:true}); },700);
}

/* ---------- boot ---------- */
$("#portrait").src=PORTRAIT;
$("#yr").textContent=new Date().getFullYear();
$$(".iconStatic").forEach(el=>{ el.outerHTML=ic(el.dataset.ic, el.dataset.ic==="arrow"?"i i--dir":"i"); });
setTheme("dark");
renderChrome(); renderBody(); counters(); onScroll();

document.addEventListener("click",e=>{
  if(e.target.closest('a[target="_blank"]')) return;   // real links always win
  const open=e.target.closest("[data-open]");        if(open) return openModal(+open.dataset.open);
  const g=e.target.closest("[data-gal]");            if(g){ GAL=+g.dataset.gal; drawGallery(+g.dataset.i); return; }
  const f=e.target.closest("[data-f]");              if(f){ FILTER=f.dataset.f; renderChrome(); renderBody(); return; }
  if(e.target.closest("[data-close]"))               return closeModal();
  const cp=e.target.closest("[data-copy]");
  if(cp&&navigator.clipboard){ e.preventDefault();
    navigator.clipboard.writeText(cp.dataset.copy).then(()=>toast(t().copied)); return; }
  if(e.target.closest(".langbtn")) return setLang(LANG==="en"?"ar":"en");
  if(e.target.closest(".themebtn"))
    return setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
  if(e.target.closest("[data-sheetclose]")) return sheet(false);
  if(e.target.closest("#burger")) return sheet(!$("#sheet").classList.contains("is-open"));
  if(e.target.closest("#top")) window.scrollTo({top:0,behavior:"smooth"});
  if(e.target.closest("#seeWork")) return goWork(e);
});
$("#q").addEventListener("input",e=>{ QUERY=e.target.value; renderGrid(); });
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ closeModal(); sheet(false); }
  if(e.key==="/"&&document.activeElement!==$("#q")){ e.preventDefault(); $("#q").focus(); }
  if((e.key==="Enter"||e.key===" ")&&document.activeElement?.classList.contains("card")){
    e.preventDefault(); openModal(+document.activeElement.dataset.open); }
  if($("#modal").classList.contains("is-open")&&GALITEMS.length>1){
    if(e.key==="ArrowRight"||e.key==="ArrowLeft"){
      const d=(e.key==="ArrowRight")===(t().dir==="ltr")?1:-1;
      GAL=(GAL+d+GALITEMS.length)%GALITEMS.length;
      drawGallery(WORK.findIndex(p=>p.n===$("#mTitle").textContent));
    }
  }
});
window.addEventListener("scroll",onScroll,{passive:true});
window.addEventListener("resize",onScroll);



</script>
</body>
