<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Eslam Afify Barakat">
  <title>EB monogram</title>
  <style>
    .dark-mark { display: none; }
    @media (prefers-color-scheme: dark) {
      .light-mark { display: none; }
      .dark-mark { display: inline; }
    }
  </style>
  <g class="light-mark">
    <rect x="2.8" y="2.8" width="90.4" height="90.4" rx="12" fill="none" stroke="#0D4A78" stroke-width="3.2"/>
    <rect x="10" y="10" width="76" height="76" rx="8" fill="none" stroke="#C1652B" stroke-width="1.7" stroke-dasharray="0.01 4.6" stroke-linecap="round"/>
    <text x="48" y="64.5" text-anchor="middle" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="-1.6">
      <tspan fill="#0D4A78">E</tspan><tspan fill="#C1652B">B</tspan>
    </text>
  </g>
  <g class="dark-mark">
    <rect x="2.8" y="2.8" width="90.4" height="90.4" rx="12" fill="none" stroke="#FFFFFF" stroke-width="3.2"/>
    <rect x="10" y="10" width="76" height="76" rx="8" fill="none" stroke="#EFA469" stroke-width="1.7" stroke-dasharray="0.01 4.6" stroke-linecap="round"/>
    <text x="48" y="64.5" text-anchor="middle" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="-1.6">
      <tspan fill="#FFFFFF">E</tspan><tspan fill="#EFA469">B</tspan>
    </text>
  </g>
</svg>
